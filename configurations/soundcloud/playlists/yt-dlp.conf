# path to main config file
--config-locations "../yt-dlp.conf"

# path to file containing urls to download
--batch-file "configurations/soundcloud/playlists/batch"

# Ignore archive file (overrides --download-archive in main script)
--no-download-archive

# Template to use for naming downloaded files
--output "%(playlist_uploader,uploader)s%(playlist_uploader_id,uploader_id& [{}]|)s/%(album_type&{}s|playlists)s/%(album&{}|)s%(album_id& [{}]|)s/%(artists.0,album_artists.0,uploader&{} - |)s%(track_number&{:02d} - |)s%(title)s%(id& [{}]|)s.%(ext)s"
